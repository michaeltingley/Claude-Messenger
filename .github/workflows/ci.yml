name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both the systemd the MCP sandbox must hold under: 24.04 ships 255, whose
    # append_static_mounts bug the TemporaryFileSystem stand-ins work around
    # and which is too old for PrivatePIDs; 26.04 ships 259, where PrivatePIDs
    # closes the /proc escape. The sandbox test asserts each in turn.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the display stack the isolation tests drive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb xauth x11vnc
      # What silently drops a user unit's sandbox there; the MCP sandbox test
      # proves the service's under it.
      - name: Restrict unprivileged user namespaces, as Ubuntu 24.04+ hosts do
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli/main.js --help
