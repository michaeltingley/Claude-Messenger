name: CI

# Once per push to a pull request, and nowhere else: a merge reruns nothing
# on main, since the pull request's run already tested the change, and the
# next pull request's run would catch two changes that break together.
on:
  pull_request:

# A newer push to the same pull request makes the run for the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole suite, once, on the VPS's Ubuntu (26.04, systemd 259).
  suite:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the display stack the isolation tests drive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb xauth x11vnc
      # What silently drops a user unit's sandbox there; the MCP sandbox test
      # proves the service's under it.
      - name: Restrict unprivileged user namespaces, as Ubuntu 24.04+ hosts do
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      # The real Claude Code, the latest as hosts auto-update to it: the digest's
      # model is proven against what it adds to a prompt (an @-mention's file),
      # and the responder's sandbox with it answering inside. Off PATH: the MCP
      # sandbox test runs configure.sh, which registers the service with any
      # Claude Code it finds.
      - name: Install Claude Code
        run: mkdir -p "$RUNNER_TEMP/claude-code" && npm install --no-save --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CLAUDE_CODE_UNDER_TEST: ${{ runner.temp }}/claude-code/node_modules/.bin/claude
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli/main.js --help

  # Ubuntu 24.04's systemd (255, built without BPF) gives the services less of
  # their sandbox: no PrivatePIDs for the MCP service or the responder, no port
  # lock for the assistant's Beeper Server. Only the three sandbox tests assert
  # anything different there (that each gap is the one the install scripts
  # warn of), so only they run. 255's append_static_mounts bug, which the
  # TemporaryFileSystem stand-ins of the MCP and responder units work around,
  # shows up in the first and the last.
  older-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restrict unprivileged user namespaces, as Ubuntu 24.04+ hosts do
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      # The responder's sandbox is proven with the real Claude Code answering in it.
      - name: Install Claude Code
        run: mkdir -p "$RUNNER_TEMP/claude-code" && npm install --no-save --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code
      - run: npm ci
      - run: >-
          npx vitest run test/mcp-sandbox.integration.test.ts test/assistant-beeper-sandbox.integration.test.ts
          test/responder-sandbox.integration.test.ts
        env:
          CLAUDE_CODE_UNDER_TEST: ${{ runner.temp }}/claude-code/node_modules/.bin/claude

  # Branch protection requires one check named "test"; this gate collapses the
  # jobs above into it: green only when all of them are, red if any failed or
  # was cancelled.
  test:
    needs: [suite, older-systemd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: test "${{ needs.suite.result }}" = "success" && test "${{ needs.older-systemd.result }}" = "success"
