name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-matrix:
    # Both the systemd the MCP sandbox must hold under: 24.04 ships 255, whose
    # append_static_mounts bug the TemporaryFileSystem stand-ins work around
    # and which is too old for PrivatePIDs; 26.04 ships 259, where PrivatePIDs
    # closes the /proc escape. The sandbox test asserts each in turn.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the display stack the isolation tests drive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb xauth x11vnc
      # What silently drops a user unit's sandbox there; the MCP sandbox test
      # proves the service's under it.
      - name: Restrict unprivileged user namespaces, as Ubuntu 24.04+ hosts do
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      # The real Claude Code, the latest as hosts auto-update to it: the digest's
      # model is proven against what it adds to a prompt (an @-mention's file).
      # Off PATH: the MCP sandbox test runs configure.sh, which registers the
      # service with any Claude Code it finds.
      - name: Install Claude Code
        run: mkdir -p "$RUNNER_TEMP/claude-code" && npm install --no-save --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CLAUDE_CODE_UNDER_TEST: ${{ runner.temp }}/claude-code/node_modules/.bin/claude
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli/main.js --help

  # Branch protection requires one check named "test"; the matrix above reports
  # as "test-matrix (os)", so this gate collapses every leg into that single
  # check — green only when all of them are, red if any failed or was cancelled.
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs passed
        run: test "${{ needs.test-matrix.result }}" = "success"
