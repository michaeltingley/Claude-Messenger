#cloud-config
# Claude Messenger — unattended host provisioning (any cloud).
#
# Paste this whole file into the instance-creation form's user-data box
# (Oracle: Advanced options -> Management -> Cloud-init script; Hetzner:
# Cloud config). On first boot it installs, with NO terminal work: Node 22,
# Tailscale, Beeper Desktop (headless under Xvfb), Claude Messenger (cloned
# + built), and Claude Code — turning the VM into a machine Claude itself
# can operate.
#
# WHY BEEPER DESKTOP AND NOT BEEPER SERVER
# ----------------------------------------
# The headless `beeper setup --server --install` path is deliberately NOT
# used. beeper/cli#21 is open and unanswered: installing Beeper Server on a
# legacy cloud-bridge account deleted every bridge connection (WhatsApp,
# Telegram, Google Messages) ACROSS ALL DEVICES, and its chats API returned
# empty results, which makes it useless for automation anyway. beeper-cli is
# still 0.6.2 (2026-05-18), so this is not fixed. Beeper Desktop + Remote
# Access is the GA path and speaks the identical Client API on :23373 —
# docs/ARCHITECTURE.md lists it as a first-class topology, so nothing above
# the provider seam changes.
#
# It deliberately stops short of the logins that are yours by nature (Claude
# account, Tailscale, and the Beeper email code + recovery key). Those happen
# in the FIRST Claude session on the box.
#
# After first boot, connect once (ssh or the cloud console) and run:
#   claude
# Sign in, then say: "Finish setting up Claude Messenger on this machine."

package_update: true
packages:
  - git
  - curl
  - ca-certificates
  - openssl
  - jq
  - tmux
  # Headless display stack for Beeper Desktop (Electron) + one-time GUI login
  - xvfb
  - x11vnc
  - novnc
  - websockify
  - libfuse2t64
  # Electron runtime dependencies (Ubuntu 24.04 "noble" package names)
  - libgtk-3-0t64
  - libnss3
  - libasound2t64
  - libgbm1
  - libxss1
  - libxtst6
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libpango-1.0-0
  - libcairo2
  - fonts-liberation

write_files:
  # Virtual display. Beeper Desktop is Electron and needs an X server even
  # though nobody is looking at it.
  - path: /home/ubuntu/.config/systemd/user/xvfb.service
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      [Unit]
      Description=Virtual framebuffer for Beeper Desktop

      [Service]
      ExecStart=/usr/bin/Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=default.target

  - path: /home/ubuntu/.config/systemd/user/beeper-desktop.service
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      [Unit]
      Description=Beeper Desktop (headless) — serves the Client API on :23373
      Requires=xvfb.service
      After=xvfb.service

      [Service]
      Environment=DISPLAY=:99
      # --no-sandbox is required because the Chromium sandbox needs either
      # user namespaces or a setuid helper, neither of which survives the
      # AppImage extraction we do to avoid a FUSE dependency.
      ExecStart=/opt/beeper/squashfs-root/AppRun --no-sandbox --disable-gpu
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=default.target

  # VNC + noVNC exist ONLY for the one-time Beeper sign-in, which needs a
  # real screen. Both bind loopback; `tailscale serve` is what makes them
  # reachable, and only from the user's own tailnet. Never expose these.
  - path: /home/ubuntu/.config/systemd/user/x11vnc.service
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      [Unit]
      Description=x11vnc on loopback (one-time Beeper GUI sign-in)
      Requires=xvfb.service
      After=xvfb.service

      [Service]
      Environment=DISPLAY=:99
      ExecStart=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=default.target

  - path: /home/ubuntu/.config/systemd/user/novnc.service
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      [Unit]
      Description=noVNC bridge so the sign-in works from a browser
      Requires=x11vnc.service
      After=x11vnc.service

      [Service]
      ExecStart=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=default.target

runcmd:
  # Node 22 (nodesource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # Tailscale (installed, not yet joined — joining needs your account)
  - curl -fsSL https://tailscale.com/install.sh | sh
  # Claude Code — the hands on this box
  - npm install -g @anthropic-ai/claude-code
  # Beeper Desktop, matched to this machine's architecture. Extracted rather
  # than run as an AppImage so we don't depend on FUSE inside systemd.
  - mkdir -p /opt/beeper
  - |
    case "$(dpkg --print-architecture)" in
      arm64) BEEPER_ARCH=arm64 ;;
      amd64) BEEPER_ARCH=x64 ;;
      *) echo "unsupported architecture $(dpkg --print-architecture)" >&2; exit 1 ;;
    esac
    curl -fsSL -o /opt/beeper/Beeper.AppImage \
      "https://api.beeper.com/desktop/download/linux/${BEEPER_ARCH}/stable/com.automattic.beeper.desktop"
    chmod +x /opt/beeper/Beeper.AppImage
    cd /opt/beeper && ./Beeper.AppImage --appimage-extract >/dev/null
    chown -R ubuntu:ubuntu /opt/beeper
  # Claude Messenger, cloned and built for the default user
  - sudo -u ubuntu git clone https://github.com/michaeltingley/Claude-Messenger.git /home/ubuntu/claude-messenger
  - sudo -u ubuntu bash -c 'cd /home/ubuntu/claude-messenger && npm ci --no-audit --no-fund && npm run build'
  # User services must survive logout/reboot
  - loginctl enable-linger ubuntu
  - sudo -u ubuntu XDG_RUNTIME_DIR=/run/user/$(id -u ubuntu) systemctl --user daemon-reload
  - sudo -u ubuntu XDG_RUNTIME_DIR=/run/user/$(id -u ubuntu) systemctl --user enable --now xvfb.service beeper-desktop.service x11vnc.service novnc.service
  # Leave a signpost for the first login
  - |
    cat > /etc/motd <<'EOF'
    ── Claude Messenger host ───────────────────────────────────────
    Provisioned by cloud-init. Everything is installed; nothing is
    logged in yet. To finish: run `claude`, sign in, and tell it:
      "Finish setting up Claude Messenger on this machine."
    (It will join Tailscale, expose the Beeper sign-in screen over
    your tailnet so you can log in from a browser, then start the
    MCP service.)
    ────────────────────────────────────────────────────────────────
    EOF

final_message: "Claude Messenger host provisioned after $UPTIME seconds. Run 'claude' to finish setup."
